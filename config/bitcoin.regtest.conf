# Bitcoin Core configuration — REGTEST
#
# Regtest is a private Bitcoin network that exists only on this machine.
# Difficulty is trivial, so blocks can be mined in milliseconds and we can
# test the full mine-and-submit path in seconds instead of years. This is
# where the miner gets built and debugged.
#
# Used via: ./scripts/node.sh start regtest

regtest=1

# Enable the JSON-RPC server. This is how our pool asks for block templates
# (getblocktemplate) and submits solved blocks (submitblock).
server=1

# Authentication is by cookie file, not password. Bitcoin Core writes a
# random secret to <datadir>/regtest/.cookie on startup and our RPC client
# reads it. Nothing secret ever lands in this config or in git.

# Don't accept inbound peer connections — regtest has no peers to talk to.
listen=0

[regtest]
# JSON-RPC endpoint. 18443 is Bitcoin Core's regtest default.
rpcport=18443

# ZeroMQ push notifications. When a new block arrives, bitcoind publishes its
# hash here. The pool subscribes so it can rebuild the block template
# immediately, rather than polling and wasting seconds hashing a dead template.
zmqpubhashblock=tcp://127.0.0.1:28332

# The wallet needs a fee estimate to send transactions, and a fresh regtest
# chain has no fee history to estimate from. This is the fallback.
fallbackfee=0.0001
