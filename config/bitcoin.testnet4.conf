# Bitcoin Core configuration — TESTNET4
#
# The current public test network. Real peer-to-peer networking, real consensus
# rules, worthless coins.
#
# Why this network is worth a phase of its own: testnet4 keeps BIP 94's
# 20-minute minimum-difficulty rule. If no block is found for 20 minutes, the
# next block may be mined at difficulty 1 — which a CPU solves in well under a
# second. So a miner like this one can genuinely win a race on a public network,
# against real peers, and have real nodes accept the result.
#
# That makes it the only honest rehearsal available before mainnet, where the
# same code has an expected time-to-block of ~180 million years.
#
# Used via: ./scripts/node.sh start testnet4

testnet4=1

# JSON-RPC, for the pool's getblocktemplate / submitblock.
server=1

# Pruned. testnet4 is small, but nothing here needs history — a mining node
# reads the UTXO set and the tip, never old blocks.
prune=2000

# Modest, because the mainnet node is running alongside this one.
dbcache=1024

[testnet4]
# 48332 is Bitcoin Core's testnet4 RPC default.
rpcport=48332

# Distinct from the regtest (28332) and mainnet (28334) ZMQ ports so all three
# can run at once without clashing.
zmqpubhashblock=tcp://127.0.0.1:28336
